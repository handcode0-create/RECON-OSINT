[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "recon-osint"
version = "4.0.0"
description = "Scope-aware OSINT reconnaissance and local security analysis toolkit"
requires-python = ">=3.10"
dependencies = []

[project.scripts]
recon-osint = "recon_osint.cli:run"

[tool.setuptools.packages.find]
include = ["recon_osint*"]
